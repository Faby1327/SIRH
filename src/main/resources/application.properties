spring.datasource.url=jdbc:postgresql://localhost:5432/sirh2
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Pas de ;jsessionid dans les URL de redirection.
server.servlet.session.tracking-modes=cookie

# Documents des employés (bloc 5) : dossier de stockage et taille maximale.
sirh.upload-dir=uploads/documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
